<svg width="1440" height="720" viewBox="0 0 1440 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Narration Pilot</title>
  <desc id="description">A scene-by-scene narration companion for macOS</desc>
  <defs>
    <linearGradient id="background" x1="70" y1="20" x2="1370" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.52" stop-color="#10233E"/>
      <stop offset="1" stop-color="#193352"/>
    </linearGradient>
    <linearGradient id="accent" x1="170" y1="190" x2="680" y2="530" gradientUnits="userSpaceOnUse">
      <stop stop-color="#65D6FF"/>
      <stop offset="1" stop-color="#8B7CFF"/>
